services:
  - type: web
    name: dola-ai-license-server
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements_server.txt
    startCommand: uvicorn server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SAAS_JWT_SECRET
        generateValue: true
